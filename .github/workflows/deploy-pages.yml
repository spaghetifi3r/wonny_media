name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/deploy-page-live-enMaT'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Try to enable Pages with workflow source
          result=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' \
            2>&1)
          exit_code=$?
          echo "Exit code: $exit_code"
          echo "Result: $result"

          if echo "$result" | grep -q "already_enabled\|already exists\|409"; then
            echo "Pages already enabled, updating source..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || true
          fi
          echo "Pages configuration complete"

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
